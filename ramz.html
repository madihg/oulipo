This is from Taper #17: Prime, Fall 2026:

https://taperzine.org/17/ramz.html

When Arabic met keyboards that refused its alphabet, it answered
with arithmetic: 2 for hamza (ء), 3 for ayn (ع), 5 for kha (خ), 7
for ha (ح), and on through the chat alphabet, each digit standing
in for the letter its shape recalls. The letters that survived
digitization did so by hiding inside numerals, and the numerals
that carry the most-used letters are the single-digit primes:
2 + 3 + 5 + 7 = 17, the number of this issue.

RAMZ (رمز, “cipher”) runs the alliance in reverse. Type any number -
a birthday, a phone number, a random mash. Every chat-alphabet digit
flickers into its letter: 4 into ذ, 6 into ط, 8 into ق, 9 into ص.
Only the primes hold. They become their letters and marry into a
sentence of Lebanese Arabic; the digits that fell away choose its
words, the way short vowels are poured into a consonant skeleton.
Same number, same sentence, every time: a Gödel numbering for the
tongue, hisab al-jummal run in reverse, every number hiding a
sentence all along.

A number with no primes earns one word, alone, with no sentence to
live in. A number with no letters at all reads صفر, sifr, the
Arabic word that became “zero” and “cipher”: every number you will
ever type is already written in Arabic numerals. In Arabic the
primes are al-a3dad al-awwaliyya, the first numbers, and they keep
that firstness here: whatever you type, they arrive first, carrying
the alphabet with them.
